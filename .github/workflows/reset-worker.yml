name: reset-worker
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (GitHub may delay scheduled runs)
  workflow_dispatch:
concurrency:
  group: reset-worker      # never two workers at once
  cancel-in-progress: false
permissions:
  contents: write          # to save activity log/state back to this repo
  models: read             # GitHub Models for the claim decision (free tier)
jobs:
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Official RESET signer (pinned commit)
        run: |
          git clone -q https://github.com/Trac-Systems/reset /tmp/reset
          git -C /tmp/reset checkout -q $(cat worker/RESET_COMMIT)
      - uses: actions/cache@v4
        with:
          path: /tmp/reset/signer/node_modules
          key: signer-${{ hashFiles('worker/RESET_COMMIT') }}
      - run: cd /tmp/reset/signer && [ -d node_modules ] || npm ci --no-audit --no-fund
      - name: Run one pass
        env:
          KEYSTORE: ${{ secrets.RESET_KEYSTORE }}
          RESET_SIGNER_PASSWORD: ${{ secrets.RESET_SIGNER_PASSWORD }}
          MODEL_URL: https://models.github.ai/inference/chat/completions
          MODEL_NAME: openai/gpt-4o-mini
          MODEL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p -m 700 /tmp/wallet
          if [ -n "$KEYSTORE" ]; then (umask 077; printf '%s' "$KEYSTORE" > /tmp/wallet/keystore.json); fi
          RESET_SIGNER_BIN=/tmp/reset/signer/bin/reset-signer.mjs RESET_SIGNER_DIRECTORY=/tmp/wallet \
          STATE_DIR=state POLICY_FILE=worker/policy.json node worker/run.mjs
          rm -rf /tmp/wallet
      - name: Save activity log
        if: always()
        run: |
          git config user.name reset-worker; git config user.email reset-worker@users.noreply.github.com
          git add -A state README.md
          git diff --cached --quiet && exit 0
          git commit -qm "worker pass"
          for i in 1 2 3 4 5; do git push -q && exit 0; git pull -q --rebase -X theirs || { git rebase --abort; git pull -q --no-rebase -X ours; }; sleep $((i*3)); done; exit 1
