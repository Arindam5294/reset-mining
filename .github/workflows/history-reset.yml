name: history-reset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          git config user.name reset-mining; git config user.email reset-mining@users.noreply.github.com
          git checkout --orphan fresh
          git add -A
          git commit -qm "RESET mining (history reset)"
          git push -f origin fresh:main
